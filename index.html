<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2bb3c0">
  <title>Cookies Clique — L’île déserte</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="stars"></div>
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="waves"><div class="wave"></div><div class="wave w2"></div></div>
  </div>

  <header class="stats">
    <div class="stat stat-coins">
      <span class="stat-value" id="coins">0</span>
      <span class="stat-label">🪙 pièces</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="per-second">0</span>
      <span class="stat-label">par seconde</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="population">0</span>
      <span class="stat-label">👥 habitants</span>
    </div>
  </header>

  <main class="layout">
    <section class="island-zone">
      <h1 id="stage-title">Îlot désert</h1>
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      <p class="stage-next" id="stage-next"></p>
      <button class="island" id="island" type="button" aria-label="Cliquer sur l’île pour gagner des pièces">
        <span class="scene" id="scene" aria-hidden="true"></span>
        <span class="scene" id="arrivals" aria-hidden="true"></span>
        <span class="island-center" id="island-emoji">🏝️</span>
      </button>
      <p class="click-hint">Touchez l’île : <strong id="click-value">+1</strong> 🪙 <span class="combo" id="combo"></span></p>
      <p class="buffs" id="buffs" hidden></p>
    </section>

    <section class="shop">
      <div id="upgrades-block" hidden>
        <h2>Améliorations</h2>
        <div class="upgrades" id="upgrades"></div>
      </div>
      <div class="shop-head">
        <h2>Construire</h2>
        <div class="buy-mode" id="buy-mode" role="group" aria-label="Quantité à acheter">
          <button type="button" data-qty="1" aria-pressed="true">×1</button>
          <button type="button" data-qty="10" aria-pressed="false">×10</button>
          <button type="button" data-qty="max" aria-pressed="false">Max</button>
        </div>
      </div>
      <p class="pop-bonus" id="pop-bonus" hidden></p>
      <div class="buildings" id="buildings"></div>
      <div class="mystery" id="mystery" hidden>
        <span class="mystery-icon" aria-hidden="true">?</span>
        <span><strong>Bâtiment mystère</strong><span id="mystery-text"></span></span>
      </div>
      <button class="reset" id="reset" type="button">Recommencer la partie</button>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="game.js"></script>
</body>
</html>
